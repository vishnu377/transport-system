<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MTC & TTC Logistics ERP</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom TMS Theme -->
  <link rel="stylesheet" href="./css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #0d1b2a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .login-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .login-header {
      background: #0f172a;
      color: #ffffff;
      padding: 30px 25px;
      text-align: center;
      position: relative;
    }
    .brand-logo-icon {
      font-size: 2.8rem;
      margin-bottom: 8px;
      display: inline-block;
      animation: floatTruck 3s ease-in-out infinite;
    }
    @keyframes floatTruck {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .btn-quick-login {
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      transition: all 0.2s ease;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      text-align: left;
      padding: 10px 14px;
      border-radius: 8px;
    }
    .btn-quick-login:hover {
      background: #e2e8f0;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="login-card">
    
    <!-- Header -->
    <div class="login-header">
      <div class="brand-logo-icon">🚛</div>
      <h4 class="fw-bold mb-1 tracking-wide">MTC & TTC LOGISTICS</h4>
      <small class="text-secondary fw-semibold">Enterprise Transport Management System</small>
      <div class="mt-2">
        <span class="badge bg-primary px-3 py-1 text-uppercase" style="font-size: 0.72rem; letter-spacing: 1px;">Staff Portal</span>
      </div>
    </div>

    <!-- Body -->
    <div class="p-4">
      
      <div id="login-alert" class="alert alert-danger d-none py-2 px-3 small mb-3"></div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLoginSubmit(event)">
        
        <div class="mb-3">
          <label class="form-label fw-semibold small text-dark">Staff Email or Username *</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
            <input type="text" id="login-email" class="form-control" placeholder="admin@ttclogistics.com" required autocomplete="username">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold small text-dark">Password *</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility()">
              <i id="eye-icon" class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember-me" checked>
            <label class="form-check-label small text-muted" for="remember-me">Remember me</label>
          </div>
          <span class="small text-muted"><i class="bi bi-shield-check text-success"></i> 256-Bit SSL</span>
        </div>

        <button type="submit" id="btn-login" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Transport ERP
        </button>

      </form>

      <!-- 1-Click Quick Demo Login Section -->
      <div class="mt-4 pt-3 border-top">
        <span class="text-uppercase fw-bold text-muted d-block mb-2 text-center" style="font-size: 0.72rem; letter-spacing: 0.8px;">
          ⚡ 1-Click Quick Staff Login (Test Accounts)
        </span>
        
        <div class="d-flex flex-column gap-2">
          
          <button type="button" class="btn btn-quick-login d-flex justify-content-between align-items-center" onclick="quickLogin('admin@ttclogistics.com', 'admin123')">
            <div>
              <span class="text-primary fw-bold">👑 (Super Admin)</span>
              <small class="d-block text-muted" style="font-size: 0.75rem;">Full P&L, Banking & Master Control</small>
            </div>
            <i class="bi bi-chevron-right text-muted"></i>
          </button>

          <button type="button" class="btn btn-quick-login d-flex justify-content-between align-items-center" onclick="quickLogin('shahpura@ttclogistics.com', 'munshi123')">
            <div>
              <span class="text-warning-emphasis fw-bold">🏢 Shahpura Munshi (Operator)</span>
              <small class="d-block text-muted" style="font-size: 0.75rem;">Bilty Booking, Diesel Slips & Advances</small>
            </div>
            <i class="bi bi-chevron-right text-muted"></i>
          </button>

          <button type="button" class="btn btn-quick-login d-flex justify-content-between align-items-center" onclick="quickLogin('accounts@ttclogistics.com', 'accounts123')">
            <div>
              <span class="text-info fw-bold">💼 Head Accountant (Munim Ji)</span>
              <small class="d-block text-muted" style="font-size: 0.75rem;">Cheques, GST Invoices & Ledgers</small>
            </div>
            <i class="bi bi-chevron-right text-muted"></i>
          </button>

        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="bg-light p-3 text-center border-top">
      <small class="text-muted" style="font-size: 0.76rem;">
        &copy; 2026 MTC & TTC Logistics ERP | Head Office: Shahpura / Rajsamand
      </small>
    </div>

  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <!-- Core App Scripts -->
  <script src="./js/config.js"></script>
  <script src="./js/db-service.js"></script>

  <script>
    function togglePasswordVisibility() {
      const passInput = document.getElementById('login-password');
      const eyeIcon = document.getElementById('eye-icon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.className = 'bi bi-eye-slash';
      } else {
        passInput.type = 'password';
        eyeIcon.className = 'bi bi-eye';
      }
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const password = document.getElementById('login-password').value;
      await authenticateUser(email, password);
    }

    async function quickLogin(email, password) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = password;
      await authenticateUser(email, password);
    }

    async function authenticateUser(email, password) {
      const alertBox = document.getElementById('login-alert');
      alertBox.classList.add('d-none');
      const btn = document.getElementById('btn-login');
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...';
      btn.disabled = true;

      try {
        const users = await dbService.getAll('users');
        const matched = users.find(u => 
          (u.email.toLowerCase() === email || (u.mobile && u.mobile === email)) &&
          u.password === password
        );

        if (!matched) {
          throw new Error("Invalid Staff Email/Username or Password. Please check and try again.");
        }

        if (matched.status === 'Inactive') {
          throw new Error("Your account has been deactivated by the Super Admin. Please contact Mosa Ji.");
        }

        // Save session
        const sessionUser = {
          id: matched.id,
          name: matched.name,
          email: matched.email,
          role: matched.role,
          firm: matched.firm || 'All Firms',
          branch: matched.branch || 'Head Office'
        };

        localStorage.setItem('tms_current_user', JSON.stringify(sessionUser));
        localStorage.setItem('tms_active_role', matched.role);

        btn.className = 'btn btn-success w-100 py-2 fw-bold shadow-sm';
        btn.innerHTML = '<i class="bi bi-check2-circle me-1"></i> Welcome ' + matched.name + '! Redirecting...';

        setTimeout(() => {
          window.location.href = './index.html';
        }, 500);

      } catch (err) {
        alertBox.innerText = err.message;
        alertBox.classList.remove('d-none');
        btn.className = 'btn btn-primary w-100 py-2 fw-bold shadow-sm';
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Transport ERP';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
