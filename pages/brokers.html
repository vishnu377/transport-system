<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brokers - MTC And TTC - Resources</title>

  <!-- Google Fonts: Roboto & Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>
    :root {
      --appsheet-topbar-h: 48px;
      --appsheet-subbar-h: 36px;
      --appsheet-rail-w: 48px;
      --appsheet-gold: #c3b15a;
      --appsheet-gold-hover: #b3a149;
      --appsheet-border: #dadce0;
      --appsheet-bg-gray: #f1f3f4;
      --appsheet-text-main: #202124;
      --appsheet-text-muted: #5f6368;
      --appsheet-blue: #1a73e8;
      --appsheet-pill-bg: #dadce0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Roboto', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8f9fa;
      color: var(--appsheet-text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* 48px Slim Left Icon Rail */
    .appsheet-rail {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--appsheet-rail-w);
      background-color: #ffffff;
      border-right: 1px solid var(--appsheet-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0;
      z-index: 1040;
    }

    .appsheet-rail-btn {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--appsheet-text-muted);
      border: none;
      background: transparent;
      margin-bottom: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      font-size: 18px;
    }

    .appsheet-rail-btn:hover {
      background-color: var(--appsheet-bg-gray);
      color: var(--appsheet-text-main);
    }

    .appsheet-rail-btn.active {
      background-color: #e8f0fe;
      color: #1a73e8;
    }

    /* Main Workspace Wrapper */
    .brokers-wrapper {
      margin-left: var(--appsheet-rail-w);
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #f8f9fa;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    .brokers-topbar {
      height: var(--appsheet-topbar-h);
      background-color: #ffffff;
      border-bottom: 1px solid var(--appsheet-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 1030;
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
      font-size: 14px;
      color: #202124;
      white-space: nowrap;
    }

    /* AppSheet Centered Search Input */
    .appsheet-search-wrap {
      flex: 1;
      max-width: 540px;
      margin: 0 24px;
      position: relative;
    }

    .appsheet-search-input {
      width: 100%;
      height: 34px;
      background-color: #f1f3f4;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0 12px 0 34px;
      font-size: 13px;
      color: #202124;
      outline: none;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .appsheet-search-input:focus {
      background-color: #ffffff;
      border-color: #1a73e8;
      box-shadow: 0 1px 3px rgba(60,64,67,0.15);
    }

    .appsheet-search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #5f6368;
      font-size: 14px;
      pointer-events: none;
    }

    /* Subheader & Breadcrumb Bar */
    .brokers-subbar {
      height: var(--appsheet-subbar-h);
      background-color: #ffffff;
      border-bottom: 1px solid var(--appsheet-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 12.5px;
      flex-shrink: 0;
    }

    .breadcrumb-item-home {
      color: var(--appsheet-text-muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .breadcrumb-item-home:hover {
      color: #1a73e8;
    }

    /* AppSheet Buttons */
    .btn-appsheet-add {
      background-color: var(--appsheet-gold);
      color: #ffffff;
      border: none;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      transition: background-color 0.15s;
    }

    .btn-appsheet-add:hover {
      background-color: var(--appsheet-gold-hover);
      color: #ffffff;
    }

    .btn-icon-subtle {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--appsheet-text-muted);
      cursor: pointer;
      font-size: 14px;
    }

    .btn-icon-subtle:hover {
      background-color: var(--appsheet-bg-gray);
      color: var(--appsheet-text-main);
    }

    .appsheet-nav-btn {
      width: 26px;
      height: 26px;
      border-radius: 3px;
      border: 1px solid var(--appsheet-border);
      background-color: #ffffff;
      color: var(--appsheet-text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .appsheet-nav-btn:hover {
      background-color: var(--appsheet-bg-gray);
      color: var(--appsheet-text-main);
    }

    /* AppSheet Pill Badge */
    .appsheet-count-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 12px;
      background-color: #e8eaed;
      color: #3c4043;
      font-size: 11.5px;
      font-weight: 500;
    }

    /* Main Scrollable Content Area */
    .brokers-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 24px;
    }

    /* View Header */
    .view-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .view-title {
      font-size: 19px;
      font-weight: 700;
      color: #202124;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* AppSheet Table Styling */
    .appsheet-table-card {
      background-color: #ffffff;
      border: 1px solid var(--appsheet-border);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(60,64,67,0.06);
    }

    .appsheet-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    .appsheet-table thead th {
      background-color: #ffffff;
      color: var(--appsheet-text-muted);
      font-weight: 600;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--appsheet-border);
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .appsheet-table tbody tr {
      border-bottom: 1px solid #f1f3f4;
      cursor: pointer;
      transition: background-color 0.12s ease;
    }

    .appsheet-table tbody tr:hover {
      background-color: #f8f9fa;
    }

    .appsheet-table tbody td {
      padding: 8px 16px;
      color: var(--appsheet-text-main);
      vertical-align: middle;
      height: 38px;
    }

    .broker-name-cell {
      font-weight: 500;
      color: #202124;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .broker-phone-link {
      color: #1a73e8;
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .broker-phone-link:hover {
      text-decoration: underline;
    }

    .broker-chevron {
      color: #bdc1c6;
      font-size: 13px;
    }

    /* Record Detail View */
    .detail-container {
      max-width: 680px;
      margin: 16px auto;
      background-color: #ffffff;
      border: 1px solid var(--appsheet-border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(60,64,67,0.08);
    }

    .detail-header-card {
      background-color: #fafafa;
      border-bottom: 1px solid var(--appsheet-border);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .detail-body {
      padding: 24px;
    }

    .detail-row {
      display: flex;
      margin-bottom: 18px;
      border-bottom: 1px solid #f1f3f4;
      padding-bottom: 14px;
    }

    .detail-row:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .detail-label {
      width: 140px;
      font-size: 12.5px;
      color: var(--appsheet-text-muted);
      font-weight: 500;
      flex-shrink: 0;
    }

    .detail-value {
      flex: 1;
      font-size: 13.5px;
      color: var(--appsheet-text-main);
      font-weight: 500;
    }

    /* AppSheet Slide Drawer */
    .offcanvas-appsheet {
      width: 440px !important;
      border-left: 1px solid var(--appsheet-border);
      box-shadow: -4px 0 16px rgba(0, 0, 0, 0.08);
    }

    .drawer-header-appsheet {
      height: 48px;
      background-color: #ffffff;
      border-bottom: 1px solid var(--appsheet-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .form-row-2col {
      display: flex;
      align-items: center;
      margin-bottom: 14px;
    }

    .form-label-left {
      width: 120px;
      font-size: 12px;
      font-weight: 500;
      color: var(--appsheet-text-muted);
      flex-shrink: 0;
    }

    .form-field-right {
      flex: 1;
    }

    .appsheet-input {
      width: 100%;
      height: 32px;
      border: 1px solid var(--appsheet-border);
      border-radius: 4px;
      padding: 0 10px;
      font-size: 12.5px;
      color: var(--appsheet-text-main);
      outline: none;
      background-color: #ffffff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .appsheet-input:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26,115,232,0.15);
    }

    .btn-appsheet-save {
      background-color: #1a73e8;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 12.5px;
      font-weight: 600;
      padding: 6px 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.15s;
    }

    .btn-appsheet-save:hover {
      background-color: #1557b0;
      color: #ffffff;
    }

    .btn-appsheet-cancel {
      background-color: transparent;
      color: var(--appsheet-text-muted);
      border: 1px solid var(--appsheet-border);
      border-radius: 4px;
      font-size: 12.5px;
      font-weight: 500;
      padding: 6px 14px;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .btn-appsheet-cancel:hover {
      background-color: #f1f3f4;
      color: var(--appsheet-text-main);
    }
  </style>
</head>
<body>

  <!-- ======================================================== -->
  <!-- 48px SLIM LEFT ICON RAIL -->
  <!-- ======================================================== -->
  <aside class="appsheet-rail">
    <a href="../index.html" class="appsheet-rail-btn" title="Dashboard Home">
      <i class="bi bi-house-door"></i>
    </a>
    <a href="shahpura.html" class="appsheet-rail-btn" title="Shahpura Hub">
      <i class="bi bi-geo-alt"></i>
    </a>
    <a href="def-urea.html" class="appsheet-rail-btn" title="DEF Urea Stock">
      <i class="bi bi-droplet-half"></i>
    </a>
    <a href="owners.html" class="appsheet-rail-btn" title="Truck Owners">
      <i class="bi bi-truck"></i>
    </a>
    <a href="parties.html" class="appsheet-rail-btn" title="Parties Directory">
      <i class="bi bi-building"></i>
    </a>
    <a href="brokers.html" class="appsheet-rail-btn active" title="Brokers Directory">
      <i class="bi bi-people-fill"></i>
    </a>
    <a href="trips.html" class="appsheet-rail-btn" title="Trips & Freight">
      <i class="bi bi-signpost-split"></i>
    </a>
  </aside>

  <!-- ======================================================== -->
  <!-- MAIN WORKSPACE -->
  <!-- ======================================================== -->
  <div class="brokers-wrapper">

    <!-- Top Navigation Bar -->
    <header class="brokers-topbar">
      <div class="app-brand">
        <a href="../index.html" class="text-dark me-1"><i class="bi bi-arrow-left"></i></a>
        <i class="bi bi-people text-secondary fs-6"></i>
        <span>MTC And TTC - Resources</span>
      </div>

      <!-- Centered Instant Search -->
      <div class="appsheet-search-wrap">
        <i class="bi bi-search appsheet-search-icon"></i>
        <input type="text" id="brokerSearchInput" class="appsheet-search-input" placeholder="Search Brokers" oninput="BrokersModule.handleSearch(this.value)">
      </div>

      <!-- Right Action Icons -->
      <div class="d-flex align-items-center gap-2">
        <button class="btn-icon-subtle" title="Help & Guides">
          <i class="bi bi-question-circle"></i>
        </button>
        <div class="dropdown">
          <button class="btn-icon-subtle rounded-circle bg-light" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Account">
            <i class="bi bi-person-circle fs-6"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-sm">
            <li><span class="dropdown-item-text fw-bold">Admin User</span></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="../index.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
          </ul>
        </div>
      </div>
    </header>

    <!-- Subheader & Breadcrumb Navigation -->
    <nav class="brokers-subbar" id="brokerSubbar">
      <!-- Breadcrumb generated by BrokersModule -->
    </nav>

    <!-- Scrollable Main Content -->
    <main class="brokers-content" id="brokerMainContent">
      <!-- Content populated dynamically: Table View or Record Detail View -->
    </main>

  </div>

  <!-- ======================================================== -->
  <!-- SLIDE DRAWER: ADD / EDIT BROKER (1:1 APPSHEET DRAWER) -->
  <!-- ======================================================== -->
  <div class="offcanvas offcanvas-end offcanvas-appsheet" tabindex="-1" id="brokerDrawer" aria-labelledby="brokerDrawerTitle">
    <div class="drawer-header-appsheet">
      <div class="d-flex align-items-center gap-2">
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        <h6 class="mb-0 fw-bold text-dark" id="brokerDrawerTitle">Details</h6>
      </div>
      <div>
        <button type="button" class="btn-appsheet-cancel me-2" data-bs-dismiss="offcanvas">Cancel</button>
        <button type="button" class="btn-appsheet-save" onclick="BrokersModule.saveBroker()">Save</button>
      </div>
    </div>

    <div class="offcanvas-body p-4">
      <input type="hidden" id="formBrokerId" value="">

      <!-- Row 1: Name -->
      <div class="form-row-2col">
        <label class="form-label-left" for="brokerInputName">Name</label>
        <div class="form-field-right">
          <input type="text" id="brokerInputName" class="appsheet-input" placeholder="Broker / Dallal Name" required>
        </div>
      </div>

      <!-- Row 2: Mobile No.* -->
      <div class="form-row-2col">
        <label class="form-label-left" for="brokerInputMobile">Mobile No. *</label>
        <div class="form-field-right">
          <input type="tel" id="brokerInputMobile" class="appsheet-input font-monospace" placeholder="10-digit mobile number" required>
        </div>
      </div>

      <!-- Row 3: Mobile No. 1 -->
      <div class="form-row-2col">
        <label class="form-label-left" for="brokerInputMobile1">Mobile No. 1</label>
        <div class="form-field-right">
          <input type="tel" id="brokerInputMobile1" class="appsheet-input font-monospace" placeholder="Secondary mobile (optional)">
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- App Core & Sample Brokers Dataset -->
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/sample-brokers-data.js"></script>
  <script src="../js/db-service.js"></script>

  <!-- Brokers Module Controller -->
  <script src="../js/modules/brokers.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof BrokersModule !== 'undefined') {
        BrokersModule.init();
      }
    });
  </script>
</body>
</html>
