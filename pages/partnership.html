<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partnership - MTC And TTC - Resources</title>

  <!-- Google Fonts: Roboto & Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>
    :root {
      --appsheet-topbar-h: 48px;
      --appsheet-subbar-h: 36px;
      --appsheet-rail-w: 48px;
      --appsheet-year-pane-w: 167px;
      --appsheet-table-w: 620px;
      --appsheet-drawer-w: 700px;
      --appsheet-gold: #c3b15a;
      --appsheet-gold-hover: #b3a149;
      --appsheet-border: #dadce0;
      --appsheet-border-light: #e0e0e0;
      --appsheet-bg-gray: #f1f3f4;
      --appsheet-text-main: #202124;
      --appsheet-text-secondary: #5f6368;
      --appsheet-text-dark: #2e2e31;
      --appsheet-blue: #1a73e8;
      --appsheet-blue-light: #e8f0fe;
      --appsheet-red: #d93025;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Roboto', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #ffffff;
      color: var(--appsheet-text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* 48px Slim Left Icon Rail (AppSheet Desktop) */
    .appsheet-rail {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--appsheet-rail-w);
      background-color: #ffffff;
      border-right: 1px solid var(--appsheet-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      z-index: 1040;
    }

    .rail-item {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--appsheet-text-secondary);
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      text-decoration: none;
      font-size: 17px;
      transition: all 0.15s;
    }

    .rail-item:hover {
      background-color: var(--appsheet-bg-gray);
      color: var(--appsheet-text-main);
    }

    .rail-item.active {
      color: var(--appsheet-blue);
      background-color: var(--appsheet-blue-light);
    }

    /* Main Workspace Wrapper (Offset by 48px Rail) */
    .appsheet-workspace {
      position: fixed;
      left: var(--appsheet-rail-w);
      top: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
      overflow: hidden;
    }

    /* Top Navigation Bar (48px) */
    .appsheet-topbar {
      height: var(--appsheet-topbar-h);
      background-color: #ffffff;
      border-bottom: 1px solid var(--appsheet-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 1030;
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--appsheet-text-main);
    }

    .app-brand a {
      color: var(--appsheet-text-main);
      text-decoration: none;
      display: flex;
      align-items: center;
    }

    /* Center Search Bar */
    .appsheet-search-wrap {
      position: relative;
      width: 360px;
      max-width: 40vw;
    }

    .appsheet-search-input {
      width: 100%;
      height: 32px;
      background-color: #f1f3f4;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0 12px 0 32px;
      font-size: 13px;
      color: #202124;
      outline: none;
      transition: all 0.2s;
    }

    .appsheet-search-input:focus {
      background-color: #ffffff;
      border-color: #1a73e8;
      box-shadow: 0 1px 3px rgba(60,64,67,0.15);
    }

    .appsheet-search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #5f6368;
      font-size: 13px;
      pointer-events: none;
    }

    .avatar-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: var(--appsheet-gold);
      color: #ffffff;
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    /* Subbar & Breadcrumb (36px) */
    .appsheet-subbar {
      height: var(--appsheet-subbar-h);
      background-color: #ffffff;
      border-bottom: 1px solid var(--appsheet-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 12.5px;
      flex-shrink: 0;
    }

    .breadcrumb-item-home {
      color: #5f6368;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .breadcrumb-item-home:hover {
      color: #1a73e8;
    }

    /* AppSheet Gold Button (#c3b15a) */
    .btn-appsheet-gold {
      background-color: var(--appsheet-gold) !important;
      color: #ffffff !important;
      border: none !important;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 14px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      transition: background-color 0.15s;
    }

    .btn-appsheet-gold:hover {
      background-color: var(--appsheet-gold-hover) !important;
    }

    .btn-icon-subtle {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--appsheet-text-secondary);
      cursor: pointer;
      font-size: 14px;
    }

    .btn-icon-subtle:hover {
      background-color: var(--appsheet-bg-gray);
      color: var(--appsheet-text-main);
    }

    /* Two-Pane Body Layout: Left Year Navigation (167px) + Main Table Area */
    .partnership-body {
      flex: 1;
      display: flex;
      overflow: hidden;
      background-color: #ffffff;
    }

    /* 167px Left Side View Navigation (1:1 with Screenshot 1) */
    .appsheet-year-pane {
      width: var(--appsheet-year-pane-w);
      background-color: #ffffff;
      border-right: 1px solid var(--appsheet-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      padding: 12px 0;
      overflow-y: auto;
    }

    .appsheet-view-item {
      height: 28px;
      line-height: 28px;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 400;
      color: var(--appsheet-text-dark);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: background-color 0.1s;
    }

    .appsheet-view-item:hover {
      background-color: var(--appsheet-bg-gray);
    }

    .appsheet-view-item.active {
      background-color: var(--appsheet-blue-light);
      color: var(--appsheet-blue);
      font-weight: 500;
    }

    /* Table & Content Area */
    .appsheet-table-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      background-color: #ffffff;
      padding: 0;
      display: flex;
    }

    /* Compact AppSheet Table (matches Screenshot 1 ~620px width) */
    .appsheet-part-table,
    .partnership-table {
      width: var(--appsheet-table-w);
      min-width: 580px;
      max-width: 650px;
      border-collapse: collapse;
      font-size: 12.5px;
      table-layout: fixed;
    }

    .appsheet-part-table thead th,
    .partnership-table thead th {
      position: sticky;
      top: 0;
      background-color: #ffffff;
      color: var(--appsheet-text-secondary);
      font-weight: 500;
      font-size: 12px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--appsheet-border-light);
      z-index: 2;
      user-select: none;
      height: 32px;
    }

    .col-month-hdr { width: 95px; text-align: left; }
    .col-income-hdr { width: 120px; text-align: right; }
    .col-expense-hdr { width: 120px; text-align: right; }
    .col-amount-hdr { width: 160px; text-align: right; }
    .col-date-hdr { width: 105px; text-align: left; padding-left: 14px !important; }

    /* Group Header Row */
    .appsheet-group-row {
      height: 32px;
      background-color: #ffffff;
      border-bottom: 1px solid var(--appsheet-border-light);
      user-select: none;
    }

    .appsheet-group-row td {
      padding: 6px 10px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--appsheet-text-main);
      vertical-align: middle;
    }

    /* Data Row (32px authentic height) */
    .appsheet-data-row {
      height: 32px;
      cursor: pointer;
      border-bottom: 1px solid var(--appsheet-border-light);
      background-color: #ffffff;
      transition: background-color 0.1s;
    }

    .appsheet-data-row:hover {
      background-color: #f8f9fa;
    }

    .appsheet-data-row td {
      padding: 6px 10px;
      color: var(--appsheet-text-main);
      vertical-align: middle;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12.5px;
    }

    .cell-month {
      font-weight: 400;
      color: var(--appsheet-text-secondary);
    }

    .cell-num {
      text-align: right;
      color: var(--appsheet-text-main); /* Standard neutral dark text, matching Screenshot 1 */
      font-variant-numeric: tabular-nums;
    }

    .cell-date {
      text-align: left;
      padding-left: 14px !important;
      color: var(--appsheet-text-main);
    }

    /* Empty Space Right of Table (Matches AppSheet Desktop) */
    .table-empty-space {
      flex: 1;
      background-color: #ffffff;
    }

    /* ========================================================
       SLIDE DRAWER (1:1 with Screenshot 2)
       ======================================================== */
    .appsheet-drawer {
      position: fixed;
      right: -720px;
      top: 0;
      bottom: 0;
      width: var(--appsheet-drawer-w);
      max-width: 90vw;
      background-color: #ffffff;
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.12);
      z-index: 1050;
      display: flex;
      flex-direction: column;
      transition: right 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .appsheet-drawer.open {
      right: 0;
    }

    /* Drawer Header */
    .drawer-header {
      height: 48px;
      padding: 0 20px;
      border-bottom: 1px solid var(--appsheet-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .drawer-title-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .drawer-close-btn {
      background: none;
      border: none;
      color: #5f6368;
      font-size: 19px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 4px;
    }

    .drawer-close-btn:hover {
      background-color: #f1f3f4;
      color: #202124;
    }

    .drawer-title {
      font-size: 16px;
      font-weight: 500;
      color: #202124;
    }

    .drawer-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .drawer-cancel-btn {
      background: none;
      border: none;
      color: #5f6368;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 4px;
    }

    .drawer-cancel-btn:hover {
      background-color: #f1f3f4;
      color: #202124;
    }

    .drawer-save-btn {
      background-color: var(--appsheet-gold);
      color: #ffffff;
      border: none;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 18px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .drawer-save-btn:hover {
      background-color: var(--appsheet-gold-hover);
    }

    /* Drawer Body */
    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
    }

    /* Two-column Form Row: Label on Left, Input on Right */
    .drawer-field-row {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .drawer-field-label {
      width: 170px;
      font-size: 13px;
      font-weight: 400;
      color: #202124;
      flex-shrink: 0;
    }

    .drawer-field-label .req {
      color: #d93025;
      margin-left: 2px;
    }

    .drawer-input-wrap {
      flex: 1;
      max-width: 320px;
    }

    .appsheet-drawer-input {
      width: 100%;
      height: 38px;
      border: 1px solid var(--appsheet-border);
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 13px;
      font-family: inherit;
      color: #202124;
      background-color: #ffffff;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .appsheet-drawer-input:focus {
      border-color: #1a73e8;
      box-shadow: 0 1px 3px rgba(60,64,67,0.15);
    }

    .appsheet-drawer-input[readonly] {
      background-color: #f8f9fa;
      color: #3c4043;
      cursor: default;
    }

    /* Lower Display / Summary Section (1:1 with Screenshot 2) */
    .drawer-summary-section {
      margin-top: 280px; /* Authentic AppSheet white spacing between form & display */
      padding-top: 20px;
      border-top: 1px solid #f1f3f4;
    }

    .summary-display-row {
      display: flex;
      align-items: center;
      margin-bottom: 18px;
    }

    .summary-display-label {
      width: 170px;
      font-size: 13px;
      font-weight: 400;
      color: #202124;
      flex-shrink: 0;
    }

    .summary-display-label .req {
      color: #d93025;
      margin-left: 2px;
    }

    .summary-display-value {
      font-size: 13px;
      font-weight: 400;
      color: #202124;
      font-variant-numeric: tabular-nums;
    }

    /* Drawer Backdrop for Mobile */
    .appsheet-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.35);
      z-index: 1045;
    }

    .appsheet-backdrop.active {
      display: block;
    }

    /* Responsive Adjustments */
    @media (max-width: 992px) {
      .appsheet-drawer {
        width: 100vw;
        max-width: 100vw;
      }
      .appsheet-part-table {
        width: 100%;
        max-width: 100%;
      }
      .drawer-summary-section {
        margin-top: 60px;
      }
    }
  </style>
</head>
<body>

  <!-- AppSheet 48px Left Navigation Rail -->
  <aside class="appsheet-rail">
    <a href="../index.html" class="rail-item" title="Menu / Dashboard">
      <i class="bi bi-list fs-5"></i>
    </a>
    <a href="../index.html" class="rail-item" title="Home">
      <i class="bi bi-house-door"></i>
    </a>
    <a href="partnership.html" class="rail-item active" title="Partnership">
      <i class="bi bi-table"></i>
    </a>
    <div class="mt-auto">
      <a href="../index.html" class="rail-item" title="Back to Resources">
        <i class="bi bi-arrow-left"></i>
      </a>
    </div>
  </aside>

  <!-- Main AppSheet Workspace -->
  <div class="appsheet-workspace">

    <!-- Top Navigation Bar (48px) -->
    <header class="appsheet-topbar">
      <div class="app-brand">
        <a href="../index.html">
          <i class="bi bi-grid-3x3-gap-fill text-muted me-2 fs-6"></i>
          <span>MTC And TTC - Resources</span>
        </a>
      </div>

      <!-- Center Search Bar: Search Partnership -->
      <div class="appsheet-search-wrap">
        <i class="bi bi-search appsheet-search-icon"></i>
        <input 
          type="text" 
          id="partnershipSearchInput" 
          class="appsheet-search-input" 
          placeholder="Search Partnership" 
          autocomplete="off"
          oninput="PartnershipModule.handleSearch(this.value)">
      </div>

      <div class="d-flex align-items-center gap-3">
        <button class="btn-icon-subtle" title="Sync with Firestore" onclick="PartnershipModule.syncData()">
          <i class="bi bi-arrow-repeat"></i>
        </button>
        <div class="avatar-circle" title="User Profile">A</div>
      </div>
    </header>

    <!-- Subbar (36px): Breadcrumb + Add Button + Filter -->
    <div class="appsheet-subbar" id="partnershipSubbar">
      <!-- Injected via PartnershipModule.renderSubbar() -->
    </div>

    <!-- Two-Pane Body: Left View Navigation (167px) + Main Table Area -->
    <main class="partnership-body">

      <!-- Left Side View Navigation (1:1 with Screenshot 1) -->
      <nav class="appsheet-year-pane" id="partnershipYearNav">
        <!-- Injected via PartnershipModule.renderYearNav() -->
      </nav>

      <!-- Main Table Container -->
      <section class="appsheet-table-container">
        <div id="partnershipMainContent">
          <!-- Injected via PartnershipModule.renderTableView() -->
        </div>
        <div class="table-empty-space"></div>
      </section>

    </main>
  </div>

  <!-- AppSheet Backdrop -->
  <div id="appsheetBackdrop" class="appsheet-backdrop" onclick="PartnershipModule.closeDrawer()"></div>

  <!-- Slide Drawer (1:1 with Screenshot 2) -->
  <aside id="partnershipDrawer" class="appsheet-drawer">
    <div class="drawer-header">
      <div class="drawer-title-wrap">
        <button class="drawer-close-btn" onclick="PartnershipModule.closeDrawer()" title="Close">
          <i class="bi bi-x-lg"></i>
        </button>
        <span class="drawer-title" id="drawerTitle"><span id="partnershipDrawerTitle">Details</span></span>
      </div>
      <div class="drawer-actions">
        <button class="drawer-cancel-btn" onclick="PartnershipModule.closeDrawer()">Cancel</button>
        <button class="drawer-save-btn" onclick="PartnershipModule.saveDrawer()">Save</button>
      </div>
    </div>

    <div class="drawer-body">
      <!-- Upper Form Fields (Two-Column Layout) -->
      <form id="partDrawerForm" onsubmit="event.preventDefault(); PartnershipModule.saveDrawer();">
        <input type="hidden" id="partRecordId">
        <input type="hidden" id="formRecordId">
        <input type="hidden" id="partInputNotes" value="">

        <!-- Date * -->
        <div class="drawer-field-row">
          <label class="drawer-field-label" for="partInputDate">
            Date <span class="req">*</span>
          </label>
          <div class="drawer-input-wrap">
            <input 
              type="text" 
              id="partInputDate" 
              class="appsheet-drawer-input" 
              placeholder="DD-MM-YYYY" 
              required>
          </div>
        </div>

        <!-- Previous Month Amount -->
        <div class="drawer-field-row">
          <label class="drawer-field-label" for="partInputPrevAmount">
            Previous Month Amount
          </label>
          <div class="drawer-input-wrap">
            <input 
              type="number" 
              step="0.01" 
              id="partInputPrevAmount" 
              class="appsheet-drawer-input" 
              placeholder="0.00" 
              oninput="PartnershipModule.recalcPartnershipAmount()">
          </div>
        </div>

        <!-- Income * -->
        <div class="drawer-field-row">
          <label class="drawer-field-label" for="partInputIncome">
            Income <span class="req">*</span>
          </label>
          <div class="drawer-input-wrap">
            <input 
              type="number" 
              step="0.01" 
              id="partInputIncome" 
              class="appsheet-drawer-input" 
              placeholder="0.00" 
              required
              oninput="PartnershipModule.recalcPartnershipAmount()">
          </div>
        </div>

        <!-- Expense * -->
        <div class="drawer-field-row">
          <label class="drawer-field-label" for="partInputExpense">
            Expense <span class="req">*</span>
          </label>
          <div class="drawer-input-wrap">
            <input 
              type="number" 
              step="0.01" 
              id="partInputExpense" 
              class="appsheet-drawer-input" 
              placeholder="0.00" 
              required
              oninput="PartnershipModule.recalcPartnershipAmount()">
          </div>
        </div>

        <!-- Partnership Amount -->
        <div class="drawer-field-row">
          <label class="drawer-field-label" for="partInputAmount">
            Partnership Amount
          </label>
          <div class="drawer-input-wrap">
            <input 
              type="number" 
              step="0.01" 
              id="partInputAmount" 
              class="appsheet-drawer-input" 
              placeholder="0.00" 
              readonly>
          </div>
        </div>
      </form>

      <!-- Lower Display / Summary Section (1:1 with Screenshot 2) -->
      <div class="drawer-summary-section">
        <div class="summary-display-row">
          <div class="summary-display-label">Income <span class="req">*</span></div>
          <div class="summary-display-value" id="summaryIncome">0.00</div>
        </div>
        <div class="summary-display-row">
          <div class="summary-display-label">Expense <span class="req">*</span></div>
          <div class="summary-display-value" id="summaryExpense">0.00</div>
        </div>
        <div class="summary-display-row">
          <div class="summary-display-label">Partnership Amount</div>
          <div class="summary-display-value" id="summaryAmount">0.00</div>
        </div>
      </div>

      <!-- Delete Button (Only for existing records) -->
      <div class="mt-4 pt-3 text-end" id="drawerDeleteWrap" style="display: none;">
        <button type="button" class="btn btn-outline-danger btn-sm" onclick="PartnershipModule.deleteCurrentRecord()">
          <i class="bi bi-trash3 me-1"></i> Delete Entry
        </button>
      </div>

    </div>
  </aside>

  <!-- Core JavaScript & Modules -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Firebase & Services -->
  <script src="../js/config.js"></script>
  <script src="../js/services/db.js"></script>
  <script src="../js/services/ui.js"></script>

  <!-- Authentic Dataset & Controller -->
  <script src="../js/sample-partnership-data.js"></script>
  <script src="../js/modules/partnership.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      PartnershipModule.init();
    });
  </script>
