<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partnership - MTC And TTC - Resources</title>

  <!-- Google Fonts: Roboto & Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>
    :root {
      --appsheet-topbar-h: 48px;
      --appsheet-subbar-h: 36px;
      --appsheet-rail-w: 48px;
      --appsheet-gold: #c3b15a;
      --appsheet-gold-hover: #b3a149;
      --appsheet-border: #dadce0;
      --appsheet-bg-gray: #f1f3f4;
      --appsheet-text-main: #202124;
      --appsheet-text-muted: #5f6368;
      --appsheet-blue: #1a73e8;
      --appsheet-green: #1e8e3e;
      --appsheet-red: #d93025;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Roboto', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8f9fa;
      color: var(--appsheet-text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* 48px Slim Left Icon Rail */
    .appsheet-rail {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--appsheet-rail-w);
      background-color: #ffffff;
      border-right: 1px solid var(--appsheet-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0;
      z-index: 1040;
    }

    .rail-item {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--appsheet-text-muted);
      text-decoration: none;
      margin-bottom: 8px;
      transition: background-color 0.15s, color 0.15s;
    }

    .rail-item:hover {
      background-color: var(--appsheet-bg-gray);
      color: var(--appsheet-text-main);
    }

    .rail-item.active {
      background-color: #e8f0fe;
      color: var(--appsheet-blue);
    }

    .rail-divider {
      width: 24px;
      height: 1px;
      background-color: var(--appsheet-border);
      margin: 6px 0 10px 0;
    }

    /* Main Workspace */
    .partnership-wrapper {
      margin-left: var(--appsheet-rail-w);
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #f8f9fa;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    .partnership-topbar {
      height: var(--appsheet-topbar-h);
      background-color: #ffffff;
      border-bottom: 1px solid var(--appsheet-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 1030;
    }

    .avatar-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #c3b15a;
      color: #ffffff;
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--appsheet-text-main);
    }

    .app-brand a {
      color: var(--appsheet-text-main);
      text-decoration: none;
      display: flex;
      align-items: center;
    }

    /* Top Search Bar */
    .appsheet-search-wrap {
      position: relative;
      width: 380px;
      max-width: 45vw;
    }

    .appsheet-search-input {
      width: 100%;
      height: 32px;
      background-color: #f1f3f4;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0 12px 0 34px;
      font-size: 13px;
      color: #202124;
      outline: none;
      transition: all 0.2s;
    }

    .appsheet-search-input:focus {
      background-color: #ffffff;
      border-color: #1a73e8;
      box-shadow: 0 1px 3px rgba(60,64,67,0.15);
    }

    .appsheet-search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #5f6368;
      font-size: 13px;
      pointer-events: none;
    }

    /* Subheader & Breadcrumb Navigation */
    .partnership-subbar {
      height: var(--appsheet-subbar-h);
      background-color: #ffffff;
      border-bottom: 1px solid var(--appsheet-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 12.5px;
      flex-shrink: 0;
    }

    .breadcrumb-item-home {
      color: #5f6368;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .breadcrumb-item-home:hover {
      color: #1a73e8;
    }

    /* AppSheet Buttons */
    .btn-appsheet-add {
      background-color: #c3b15a !important;
      color: #ffffff !important;
      border: none !important;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      transition: background-color 0.15s;
    }

    .btn-appsheet-add:hover {
      background-color: #b3a149 !important;
      color: #ffffff !important;
    }

    .btn-icon-subtle {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--appsheet-text-muted);
      cursor: pointer;
      font-size: 14px;
    }

    .btn-icon-subtle:hover {
      background-color: var(--appsheet-bg-gray);
      color: var(--appsheet-text-main);
    }

    /* Two-Pane Body Layout (Year Pane on Left, Table on Right) */
    .partnership-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .year-nav-pane {
      width: 200px;
      background-color: #ffffff;
      border-right: 1px solid var(--appsheet-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
      padding: 12px 8px;
    }

    .year-item {
      padding: 9px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--appsheet-text-main);
      cursor: pointer;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s;
    }

    .year-item:hover {
      background-color: var(--appsheet-bg-gray);
    }

    .year-item.active {
      background-color: #e8f0fe;
      color: var(--appsheet-blue);
      font-weight: 600;
    }

    .year-badge {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      padding: 2px 6px;
      border-radius: 10px;
      background-color: #f1f3f4;
      color: var(--appsheet-text-muted);
    }

    .year-item.active .year-badge {
      background-color: #d2e3fc;
      color: var(--appsheet-blue);
    }

    /* Main Content Area */
    .partnership-main {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      padding: 0;
      position: relative;
      background-color: #ffffff;
    }

    /* AppSheet Table Styles */
    .partnership-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    .partnership-table thead th {
      position: sticky;
      top: 0;
      background-color: #ffffff;
      color: var(--appsheet-text-muted);
      font-weight: 500;
      text-align: left;
      font-size: 12px;
      letter-spacing: 0.3px;
      padding: 9px 16px;
      border-bottom: 1px solid var(--appsheet-border);
      z-index: 2;
      user-select: none;
    }

    .appsheet-group-header-row td {
      background-color: #f8f9fa;
      font-weight: 600;
      font-size: 12px;
      color: var(--appsheet-text-main);
      padding: 6px 16px;
      border-bottom: 1px solid var(--appsheet-border);
      user-select: none;
    }

    .partnership-table tbody tr.data-row {
      cursor: pointer;
      border-bottom: 1px solid #f1f3f4;
      transition: background-color 0.1s;
    }

    .partnership-table tbody tr.data-row:hover {
      background-color: #f8f9fa;
    }

    .partnership-table tbody td {
      padding: 8px 16px;
      color: var(--appsheet-text-main);
      vertical-align: middle;
      white-space: nowrap;
    }

    .amount-cell {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      text-align: right;
    }

    .amount-cell-inc {
      color: var(--appsheet-green);
      font-weight: 600;
    }

    .amount-cell-exp {
      color: var(--appsheet-red);
      font-weight: 500;
    }

    .amount-cell-part {
      color: #1a73e8;
      font-weight: 700;
    }

    .date-cell {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #3c4043;
    }

    /* Slide Drawer */
    .offcanvas-appsheet {
      width: 480px !important;
      border-left: 1px solid var(--appsheet-border);
      box-shadow: -4px 0 24px rgba(0,0,0,0.12);
    }

    .drawer-header-appsheet {
      height: 48px;
      border-bottom: 1px solid var(--appsheet-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .form-row-2col {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
    }

    .form-label-left {
      width: 170px;
      font-size: 12.5px;
      color: var(--appsheet-text-main);
      font-weight: 500;
      flex-shrink: 0;
    }

    .form-field-right {
      flex: 1;
      position: relative;
    }

    .appsheet-input {
      width: 100%;
      height: 34px;
      border: 1px solid var(--appsheet-border);
      border-radius: 4px;
      padding: 0 10px;
      font-size: 12.5px;
      color: var(--appsheet-text-main);
      outline: none;
      transition: border-color 0.15s;
    }

    .appsheet-input:focus {
      border-color: #1a73e8;
    }

    .appsheet-input:read-only {
      background-color: #f8f9fa;
      color: #5f6368;
    }

    .btn-appsheet-save {
      background-color: #c3b15a !important;
      color: #ffffff !important;
      border: none;
      border-radius: 4px;
      font-size: 12.5px;
      font-weight: 600;
      padding: 6px 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.15s;
    }

    .btn-appsheet-save:hover {
      background-color: #b3a149 !important;
      color: #ffffff !important;
    }

    .btn-appsheet-cancel {
      background-color: transparent;
      color: var(--appsheet-text-main);
      border: none;
      font-size: 12.5px;
      font-weight: 500;
      padding: 6px 14px;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .btn-appsheet-cancel:hover {
      background-color: var(--appsheet-bg-gray);
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- ======================================================== -->
  <!-- 48px SLIM LEFT ICON RAIL (1:1 APPSHEET DESKTOP) -->
  <!-- ======================================================== -->
  <aside class="appsheet-rail">
    <a href="../index.html" class="rail-item" title="Dashboard">
      <i class="bi bi-speedometer2 fs-5"></i>
    </a>
    <div class="rail-divider"></div>
    <a href="./bilty-booking.html" class="rail-item" title="Bilty Booking">
      <i class="bi bi-file-earmark-text fs-5"></i>
    </a>
    <a href="./trips.html" class="rail-item" title="Trips Master">
      <i class="bi bi-truck fs-5"></i>
    </a>
    <a href="./cheques.html" class="rail-item" title="Cheques & Dues">
      <i class="bi bi-cash-stack fs-5"></i>
    </a>
    <a href="./shahpura.html" class="rail-item" title="Shahpura Cash Register">
      <i class="bi bi-wallet2 fs-5"></i>
    </a>
    <a href="./def-urea.html" class="rail-item" title="DEF Urea Stock">
      <i class="bi bi-droplet-half fs-5"></i>
    </a>
    <a href="./brokers.html" class="rail-item" title="Brokers Directory">
      <i class="bi bi-people fs-5"></i>
    </a>
    <a href="./drivers.html" class="rail-item" title="Drivers Directory">
      <i class="bi bi-person-vcard fs-5"></i>
    </a>
    <a href="./partnership.html" class="rail-item active" title="Partnership">
      <i class="bi bi-diagram-3 fs-5"></i>
    </a>
  </aside>

  <!-- ======================================================== -->
  <!-- MAIN WORKSPACE -->
  <!-- ======================================================== -->
  <div class="partnership-wrapper">

    <!-- Top Navigation Bar -->
    <header class="partnership-topbar">
      <div class="app-brand">
        <a href="../index.html" class="text-dark me-1"><i class="bi bi-arrow-left"></i></a>
        <span>MTC And TTC - Resources</span>
      </div>

      <!-- Center Search Field -->
      <div class="appsheet-search-wrap">
        <i class="bi bi-search appsheet-search-icon"></i>
        <input type="text" id="partnershipSearchInput" class="appsheet-search-input" placeholder="Search Partnership" oninput="PartnershipModule.handleSearch(this.value)">
      </div>

      <!-- Right Action Icons -->
      <div class="d-flex align-items-center gap-2">
        <button class="btn-icon-subtle" title="Help & Guides">
          <i class="bi bi-question-circle"></i>
        </button>
        <div class="avatar-circle" title="User Profile">M</div>
      </div>
    </header>

    <!-- Subheader & Breadcrumb Navigation -->
    <nav class="partnership-subbar" id="partnershipSubbar">
      <!-- Generated dynamically by PartnershipModule -->
    </nav>

    <!-- Two-Pane Body: Left Year Navigation & Right Table Area -->
    <div class="partnership-body">
      <!-- Left Year Selection Pane -->
      <div class="year-nav-pane" id="partnershipYearNav">
        <!-- Rendered dynamically -->
      </div>

      <!-- Main Table Scrollable Content -->
      <main class="partnership-main" id="partnershipMainContent">
        <!-- Rendered dynamically -->
      </main>
    </div>

  </div>

  <!-- ======================================================== -->
  <!-- SLIDE DRAWER: ADD / EDIT PARTNERSHIP RECORD (1:1 APPSHEET) -->
  <!-- ======================================================== -->
  <div class="offcanvas offcanvas-end offcanvas-appsheet" tabindex="-1" id="partnershipDrawer" aria-labelledby="partnershipDrawerTitle">
    <div class="drawer-header-appsheet">
      <div class="d-flex align-items-center gap-2">
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        <h6 class="mb-0 fw-bold text-dark" id="partnershipDrawerTitle">Details</h6>
      </div>
      <div>
        <button type="button" class="btn-appsheet-cancel me-2" data-bs-dismiss="offcanvas">Cancel</button>
        <button type="button" class="btn-appsheet-save" onclick="PartnershipModule.saveRecord()">Save</button>
      </div>
    </div>

    <div class="offcanvas-body p-4">
      <input type="hidden" id="formRecordId" value="">

      <!-- Row 1: Date * -->
      <div class="form-row-2col">
        <label class="form-label-left" for="partInputDate">Date *</label>
        <div class="form-field-right">
          <input type="text" id="partInputDate" class="appsheet-input font-monospace" placeholder="DD-MM-YYYY (e.g. 31-10-2026)" required oninput="PartnershipModule.onDateChange(this.value)">
        </div>
      </div>

      <!-- Row 2: Previous Month Amount -->
      <div class="form-row-2col">
        <label class="form-label-left" for="partInputPrevAmount">Previous Month Amount</label>
        <div class="form-field-right">
          <input type="number" step="0.01" id="partInputPrevAmount" class="appsheet-input font-monospace" placeholder="0.00" oninput="PartnershipModule.recalcPartnershipAmount()">
        </div>
      </div>

      <!-- Row 3: Income * -->
      <div class="form-row-2col">
        <label class="form-label-left" for="partInputIncome">Income *</label>
        <div class="form-field-right">
          <input type="number" step="0.01" id="partInputIncome" class="appsheet-input font-monospace" placeholder="0.00" required oninput="PartnershipModule.recalcPartnershipAmount()">
        </div>
      </div>

      <!-- Row 4: Expense * -->
      <div class="form-row-2col">
        <label class="form-label-left" for="partInputExpense">Expense *</label>
        <div class="form-field-right">
          <input type="number" step="0.01" id="partInputExpense" class="appsheet-input font-monospace" placeholder="0.00" required oninput="PartnershipModule.recalcPartnershipAmount()">
        </div>
      </div>

      <!-- Row 5: Partnership Amount (Computed) -->
      <div class="form-row-2col">
        <label class="form-label-left" for="partInputAmount">Partnership Amount</label>
        <div class="form-field-right">
          <input type="number" step="0.01" id="partInputAmount" class="appsheet-input font-monospace fw-bold text-primary" placeholder="0.00" readonly>
        </div>
      </div>

      <!-- Row 6: Notes (Optional) -->
      <div class="form-row-2col">
        <label class="form-label-left" for="partInputNotes">Description / Notes</label>
        <div class="form-field-right">
          <input type="text" id="partInputNotes" class="appsheet-input" placeholder="Settlement description">
        </div>
      </div>

      <!-- Partner Profit Share Card (MTC & TTC 50-50%) -->
      <div class="mt-4 p-3 bg-light rounded border">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <span class="small fw-bold text-dark">Partnership Calculation</span>
          <span class="badge bg-primary-subtle text-primary border font-monospace">Balance</span>
        </div>
        <div class="small text-muted mb-1">
          Formula: <span class="font-monospace text-dark">Partnership Amount = Previous Month + Income - Expense</span>
        </div>
        <div class="d-flex justify-content-between pt-2 border-top mt-2">
          <span class="small fw-semibold">Net Balance:</span>
          <span id="previewCalculatedAmount" class="small font-monospace fw-bold text-primary">₹ 0.00</span>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Database & Master Data Scripts -->
  <script src="../js/sample-partnership-data.js"></script>
  <script src="../js/db-service.js"></script>
  <script src="../js/app-ui.js"></script>

  <!-- Partnership Module Controller -->
  <script src="../js/modules/partnership.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof PartnershipModule !== 'undefined') {
        PartnershipModule.init();
      }
    });
  </script>
</body>
</html>
