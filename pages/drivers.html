<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drivers Master - MTC & TTC Logistics</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom TMS Theme -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Sidebar Navigation -->
  <nav id="sidebar"></nav>

  <!-- Main Workspace -->
  <div id="main-content">
    
    <!-- Top Navbar -->
    <header class="top-navbar d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-3">
        <button id="sidebar-toggle" class="btn btn-light d-lg-none">
          <i class="bi bi-list fs-5"></i>
        </button>
        <div>
          <h5 class="mb-0 fw-bold text-dark">Drivers Master Directory</h5>
          <small class="text-muted">Register drivers, contacts, license numbers, and linked truck owners</small>
        </div>
      </div>

      <div>
        <button class="btn btn-primary btn-sm d-flex align-items-center gap-1 shadow-sm" onclick="DriversModule.openAddModal()">
          <i class="bi bi-plus-lg"></i> <span>Register Driver</span>
        </button>
      </div>
    </header>

    <!-- Page Content -->
    <main class="page-container">

      <!-- Summary Stat Cards -->
      <div class="row g-3 mb-4">
        <div class="col-12 col-md-4">
          <div class="metric-card">
            <div class="metric-icon bg-primary-subtle text-primary">
              <i class="bi bi-person-vcard"></i>
            </div>
            <div class="metric-title">Registered Fleet Drivers</div>
            <div id="stat-total-drivers" class="metric-value">0</div>
          </div>
        </div>
      </div>

      <!-- Drivers Data Card -->
      <div class="data-card">
        <div class="data-card-header">
          <div class="d-flex align-items-center gap-2 flex-grow-1" style="max-width: 450px;">
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
              <input type="text" id="search-drivers" class="form-control" placeholder="Search by Driver Name, Mobile, Owner, or License...">
            </div>
          </div>
          <span class="badge bg-light text-dark border">
            <i class="bi bi-check2-circle text-success me-1"></i> Active List
          </span>
        </div>

        <div class="table-responsive">
          <table class="table table-custom mb-0">
            <thead>
              <tr>
                <th>Driver Name</th>
                <th>Mobile Number</th>
                <th>Linked Owner</th>
                <th>Driving License No.</th>
                <th class="text-center" style="width: 100px;">Actions</th>
              </tr>
            </thead>
            <tbody id="drivers-tbody">
              <tr>
                <td colspan="5" class="text-center py-4 text-muted">
                  <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div> Loading drivers...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>

  </div>

  <!-- Add / Edit Driver Modal -->
  <div class="modal fade" id="driverModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-primary text-white">
          <h6 class="modal-title fw-bold" id="driver-modal-title">Register Driver</h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form id="driver-form">
          <div class="modal-body p-4">
            <input type="hidden" id="driver-id">
            
            <div class="mb-3">
              <label class="form-label fw-semibold small">Driver Full Name *</label>
              <input type="text" id="driver-name" class="form-control" placeholder="e.g. Kaluram Jat Shrinagar" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold small">Mobile Number *</label>
              <input type="tel" id="driver-mobile" class="form-control" placeholder="e.g. 9784175913" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold small">Linked Truck Owner</label>
              <select id="driver-owner" class="form-select">
                <option value="">-- Select Linked Owner --</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold small">Driving License Number</label>
              <input type="text" id="driver-license" class="form-control font-monospace text-uppercase" placeholder="e.g. RJ-01-2018-00912">
            </div>

          </div>
          <div class="modal-footer bg-light">
            <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-sm btn-primary px-3 shadow-sm">Save Driver</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Firebase SDK (Compatible v8 CDN) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <!-- Core App Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/db-service.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/modules/drivers.js"></script>
</body>
</html>
